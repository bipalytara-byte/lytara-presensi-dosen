<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LYTARA TV — Kehadiran Dosen</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #080a0f;
  --surface: #0f1219;
  --surface2: #161b25;
  --border: rgba(255,255,255,0.06);
  --text: #f0f4ff;
  --muted: #4b5563;
  --green: #22c55e;
  --green-dim: rgba(34,197,94,0.1);
  --red: #ef4444;
  --red-dim: rgba(239,68,68,0.1);
  --orange: #f97316;
  --blue: #60a5fa;
  --blue-dim: rgba(96,165,250,0.1);
  --gold: #f5c842;
  --gold-dim: rgba(245,200,66,0.15);
  --yellow: #facc15;
}

body {
  background-color: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  margin: 0;
  padding: 0;
  overflow: hidden; /* Mencegah scroll bar agar optimal untuk layar TV */
}

/* Kustomisasi Anomaly Overlay */
.ao-paused-label { display: none; position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: var(--orange); color: #fff; padding: 5px 15px; border-radius: 20px; font-weight: bold; z-index: 100; }
#anomaly-overlay { display: none; position: fixed; bottom: 20px; right: 20px; width: 450px; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 1000; padding: 20px; }
#anomaly-overlay.open { display: block; }
.ao-topbar { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
.ao-title { display: flex; gap: 15px; }
.ao-title-text { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 5px; }
.ao-sub { font-size: 13px; color: var(--muted); line-height: 1.4; }
.ao-close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; transition: color 0.2s; }
.ao-close:hover { color: var(--red); }
.ao-list { max-height: 200px; overflow-y: auto; font-size: 14px; }
.ao-item { padding: 10px 0; border-bottom: 1px solid var(--border); }
.hl { color: var(--text); }
</style>
</head>
<body>

<div id="main-container" style="padding: 20px;">
  <div id="clock" style="font-size: 24px; font-weight: 500; text-align: right; color: var(--muted);">00:00:00</div>
</div>

<div class="ao-paused-label" id="paused-label">⏸ SLIDE DIJEDA</div>
<div id="anomaly-overlay">
  <div class="ao-topbar">
    <div class="ao-title">
      <span style="font-size:32px">🔍</span>
      <div>
        <div class="ao-title-text">Catatan Rekaman Anomali</div>
        <div class="ao-sub">
          Kejadian berikut <b style="color:var(--text)">tidak dihitung</b> dalam skor leaderboard karena waktu rekam tercatat
          <b style="color:var(--yellow)">setelah jam selesai kelas</b> — mengindikasikan kemungkinan lupa absen, bukan keterlambatan hadir sesungguhnya.
        </div>
      </div>
    </div>
    <button class="ao-close" onclick="closeAnomalyOverlay()">✕ &nbsp;Tutup</button>
  </div>
  <div class="ao-list" id="anomaly-list"></div>
</div>

<script>
// ── KONFIGURASI ──
const SLIDE_DUR = 10000;
const REFRESH_SEC = 60;

// ── FUNGSI UI & OVERLAY ──
function renderAnomalyList(anomalies) {
  if(!anomalies || anomalies.length === 0) return '';
  return anomalies.map(a => {
    let penjelasan = a.penjelasan || '';
    let cat = a.cat || '';
    let catLabel = a.catLabel || '';
    return `<div class="ao-item">
      <div>
        <b>${a.nama}</b><br/>
        <div style="color:var(--muted); font-size:12px; margin-top:4px;">
          Rekaman hadir: <b class="hl">${a.waktuHadir}</b> &nbsp;|&nbsp;
          ${penjelasan}
        </div>
      </div>
      <div class="ao-cat ${cat}">${catLabel}</div>
    </div>`;
  }).join('');
}

function openAnomalyOverlay() { document.getElementById('anomaly-overlay').classList.add('open'); }
function closeAnomalyOverlay() { document.getElementById('anomaly-overlay').classList.remove('open'); }

function updateClock() {
  const clockEl = document.getElementById('clock');
  if(clockEl) {
    const now = new Date();
    clockEl.textContent = now.toLocaleTimeString('id-ID');
  }
}

// ── LOGIKA DATA ──
async function loadData() {
  // Masukkan kembali logika fetch API atau update DOM kamu di bawah ini
  console.log("Memuat data...");
}

function startSlideShow() {
  // Masukkan kembali logika otomatisasi slide TV kamu di bawah ini
  console.log("Memulai slideshow...");
}

// ── INIT ──
window.addEventListener('DOMContentLoaded', async ()=>{
  setInterval(updateClock, 1000);
  updateClock();

  // Set CSS variable untuk durasi slide
  document.documentElement.style.setProperty('--slide-dur', (SLIDE_DUR/1000)+'s');

  await loadData();
  startSlideShow();

  // Auto-refresh data setiap detik yang ditentukan (60s)
  setInterval(loadData, REFRESH_SEC * 1000);
});
</script>

</body>
</html>
